image efi-part.vfat {
	vfat {
		file EFI {
			image = "efi-part/EFI"
		}
		file kernel {
			image = "kernel"
		}
	}

	size = 128M
}

image disk.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "efi-part.vfat"
		partition-type-uuid = U
		offset = 32K
		bootable = true
	}

	partition root {
		partition-type-uuid = root-loongarch64
		image = "rootfs.ext"
	}

	partition cfgfs {
    		partition-type-uuid = 0FC63DAF-8483-4772-8E79-3D69D8477DE4
    		image = "cfgfs.img"
  	}

}
