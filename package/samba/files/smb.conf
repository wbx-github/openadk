[global]
 log level = 1
 workgroup = OpenADK
 server string = OpenADK Samba Server
 security = user
 guest account = nobody
 local master = yes
 name resolve order = bcast
 pid directory = /var/run/samba
 load printers = no
 printcap name = /dev/null
 unix charset = UTF8
 dos charset = ASCII 
 unix extensions = yes 

